services:
  db:
    image: postgres:16
    container_name: kesa-db
    environment:
      POSTGRES_DB: kesa
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - kesa_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kesa"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    container_name: kesa-backend
    working_dir: /src
    volumes:
      - ./:/src
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=kesa;Username=postgres;Password=postgres
    command: >
      sh -c "
      dotnet tool restore &&
      dotnet tool run dotnet-ef database update &&
      dotnet restore &&
      dotnet run --project Kesa.csproj --urls http://0.0.0.0:8080
      "
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  kesa_pgdata:
